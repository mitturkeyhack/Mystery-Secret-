name: Sesleri indir
on:
  push:
    paths: ['audio-src/urls.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: İndir ve işle
        run: |
          mkdir -p public/media/audio
          while read -r name fx url; do
            [ -z "$name" ] && continue
            curl -sSfL -o "/tmp/$name.wav" "$url"
            case $fx in
              tape)  AF="highpass=f=250,lowpass=f=3600,acompressor,volume=1.4" ;;
              phone) AF="highpass=f=300,lowpass=f=3400,volume=1.3" ;;
              demon) AF="asetrate=24000*0.78,aresample=44100,atempo=1.1,aecho=0.8:0.85:180|420:0.35|0.22,lowpass=f=3000,volume=1.6" ;;
              *)     AF="anull" ;;
            esac
            ffmpeg -v error -y -i "/tmp/$name.wav" -af "$AF" -ac 1 -c:a libmp3lame -b:a 64k "public/media/audio/$name.mp3"
            echo "$name OK"
          done < audio-src/urls.txt
          git rm -q audio-src/urls.txt
      - name: Kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add public/media/audio
          git commit -m "Sesler eklendi (Speko)"
          git push
