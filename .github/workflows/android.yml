name: Kayip Telefon APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VER: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Paketleri kur
        run: npm install
      - name: Oyunu derle
        run: npm run build
      - name: Android projesi oluştur
        run: npx cap add android
      - name: Simge ve açılış ekranı
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
      - name: Dikey ekran, tam ekran ve sürüm numarası
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' $M
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA" /><uses-feature android:name="android.hardware.camera" android:required="false" /></manifest>#' $M
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#<item name="windowActionBar">false</item>#<item name="windowActionBar">false</item><item name="android:windowFullscreen">true</item>#' $S
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" $G
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VER\"/" $G
      - name: Senkronla
        run: npx cap sync android
      - name: Sabit imza anahtarı (güncellemelerin üstüne kurulabilmesi için)
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("../../signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.debug } }
          }
          GRADLE
      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../KayipTelefon-v$VER.apk
          keytool -printcert -jarfile ../KayipTelefon-v$VER.apk | grep SHA256
      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: KayipTelefon-APK
          path: KayipTelefon-v${{ env.VER }}.apk
      - name: Sürüm yayınla (uygulama içi güncelleme buradan okur)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Kayıp Telefon v${{ env.VER }}
          body: ${{ github.event.head_commit.message }}
          files: KayipTelefon-v${{ env.VER }}.apk
          make_latest: true
